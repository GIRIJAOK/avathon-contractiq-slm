model_name: Qwen/Qwen2.5-7B-Instruct

train_file: data/processed/train_sft.jsonl
validation_file: data/processed/validation_sft.jsonl

output_dir: artifacts/qwen_dora_r8

max_seq_length: 3072

lora:
  rank: 8
  alpha: 16
  dropout: 0.05

  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  learning_rate: 0.0001
  epochs: 2

  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 8

  # Transformers v5:
  # float < 1 means fraction of total training steps
  warmup_steps: 0.05

  weight_decay: 0.01
  lr_scheduler_type: cosine

  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2

  seed: 42